<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cactus Repair Lab</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <img id="logo" src="logo.png" alt="" onerror="this.remove()">
    <h1>Repair Lab</h1>
    <button id="signout" class="ghost" hidden>Sign out</button>
  </header>
  <main>
    <div id="banner"></div>
    <div class="toolbar">
      <div class="segmented"><button id="view-board" class="active">Board</button><button id="view-list">List</button><button id="view-dashboard">Dashboard</button></div>
      <input type="search" id="search" placeholder="Search invoice, customer, product…">
      <select id="filter-status"></select>
      <button class="primary" id="add-repair">+ New repair</button>
      <button class="ghost" id="force-sync" title="Re-check Cin7 for new orders and product changes">⟳ Force sync</button>
    </div>
    <div id="summary" class="muted"></div>
    <div id="content"></div>
  </main>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
