<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cactus Repair Lab</title>
<style>
:root{--bg:#f5f4f0;--panel:#fff;--ink:#1e2622;--muted:#6b746e;--line:#dcd9d0;--accent:#2f5d3a;--accent-ink:#fff;--danger:#a3312a;--ok:#2f5d3a;--chip-bg:#eef1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#171a17;--panel:#20241f;--ink:#eae7df;--muted:#9aa39a;--line:#333831;--accent:#5b9c6d;--accent-ink:#0d130e;--chip-bg:#293028;}}
:root[data-theme="dark"]{--bg:#171a17;--panel:#20241f;--ink:#eae7df;--muted:#9aa39a;--line:#333831;--accent:#5b9c6d;--accent-ink:#0d130e;--chip-bg:#293028;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;}
header{position:relative;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line);}
header h1{margin:0;font-size:1.25rem;}
header p{margin:2px 0 0;color:var(--muted);font-size:.85rem;}
main{max-width:1100px;margin:0 auto;padding:16px;}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.stat{flex:1;min-width:110px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.stat b{display:block;font-size:1.4rem;}
.stat span{color:var(--muted);font-size:.75rem;}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;}
.toolbar input[type=search]{flex:1;min-width:140px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);}
select,button,input,textarea{font:inherit;}
select{padding:9px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);}
button{cursor:pointer;border:none;border-radius:8px;padding:9px 14px;background:var(--chip-bg);color:var(--ink);}
button.primary{background:var(--accent);color:var(--accent-ink);font-weight:600;}
button.ghost{background:transparent;border:1px solid var(--line);}
.viewToggle{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
.viewToggle button{border-radius:0;background:var(--panel);}
.viewToggle button.active{background:var(--accent);color:var(--accent-ink);font-weight:600;}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);}
table{border-collapse:collapse;width:100%;min-width:920px;font-size:.85rem;}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{color:var(--muted);font-weight:600;font-size:.72rem;text-transform:uppercase;letter-spacing:.4px;}
tbody tr{cursor:pointer;}tbody tr:hover{background:var(--chip-bg);}
.pill{padding:3px 9px;border-radius:99px;font-size:.72rem;font-weight:600;display:inline-block;}
.pill.recv{background:#e4e0cf;color:#6b5a1a;}.pill.prog{background:#dce6f2;color:#1d4f7a;}
.pill.ready{background:#e2ecdf;color:var(--accent);}.pill.done{background:var(--chip-bg);color:var(--muted);}
.pill.unpaid{background:#f5ddd7;color:var(--danger);}.pill.paid{background:#e2ecdf;color:var(--ok);}.pill.waived{background:var(--chip-bg);color:var(--muted);}
.rowbtn{padding:5px 9px;font-size:.75rem;}
.empty{padding:30px;text-align:center;color:var(--muted);}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;}
.col{flex:0 0 250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;display:flex;flex-direction:column;max-height:calc(100vh - 260px);}
.col.dragover{outline:2px dashed var(--accent);outline-offset:-2px;}
.col-head{padding:10px 12px;border-bottom:1px solid var(--line);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);display:flex;justify-content:space-between;}
.col-body{padding:8px;overflow-y:auto;flex:1;min-height:60px;display:flex;flex-direction:column;gap:8px;}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:grab;font-size:.82rem;}
.card.dragging{opacity:.4;}
.card b{display:block;font-size:.88rem;}
.card .meta{color:var(--muted);font-size:.72rem;margin-top:3px;}
.card .pills{margin-top:6px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;z-index:20;}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:600px;border:1px solid var(--line);}
.modal h2{margin-top:0;font-size:1.05rem;}
.modal h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:18px 0 8px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
.field label{font-size:.75rem;color:var(--muted);}
.field input,.field select,.field textarea,.cbox textarea{padding:8px 9px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);width:100%;}
.field textarea,.cbox textarea{resize:vertical;min-height:50px;}
.modal-actions{display:flex;justify-content:space-between;gap:8px;margin-top:14px;}
.cbox{display:flex;gap:8px;align-items:flex-end;margin-bottom:12px;}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:14px;display:flex;flex-direction:column;gap:12px;}
.ev{position:relative;font-size:.83rem;}
.ev::before{content:"";position:absolute;left:-20px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
.ev.comment::before{background:#1d4f7a;}
.ev .txt{white-space:pre-wrap;}
.ev.comment .txt{background:var(--chip-bg);padding:7px 10px;border-radius:8px;margin-top:3px;}
.ev .by{color:var(--muted);font-size:.72rem;margin-top:2px;}
.banner{background:#f5ddd7;color:var(--danger);padding:10px 14px;border-radius:8px;margin-bottom:12px;font-size:.85rem;}
</style>
</head>
<body>
<header><h1>🧵 Cactus Repair Lab</h1><p>Repair tracking — replaces the manual spreadsheet</p></header>
<main>
  <div id="banner"></div>
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <div class="viewToggle"><button id="vTable" class="active">Table</button><button id="vBoard">Board</button></div>
    <input type="search" id="search" placeholder="Search invoice #, item, description…">
    <select id="filterStatus"></select>
    <select id="filterPayment"></select>
    <button class="primary" id="addBtn">+ New repair</button>
  </div>
  <div class="tablewrap" id="tableView">
    <table>
      <thead><tr><th>Invoice #</th><th>Received</th><th>Item</th><th>Category</th><th>Qty</th><th>Status</th><th>Payment</th><th>Out date</th><th>Repair time (min)</th><th>Material cost</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyMsg" style="display:none;">No repairs match — add one above.</div>
  </div>
  <div class="board" id="boardView" style="display:none;"></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://pcqvwnsrdpetvrnyqanm.supabase.co",SUPABASE_KEY="sb_publishable_QEeBUgXqayCGCKdmJtTW3A_P_BZQR1s";
const STATUSES=["Received","In Progress","Ready for Pickup","Completed"];
const PAYMENTS=["Unpaid","Paid","Waived"];
const CATEGORIES=["Jacket","Pants","Bag","Boots/Footwear","Vest","Base Layer","Other"];
const statusClass={"Received":"recv","In Progress":"prog","Ready for Pickup":"ready","Completed":"done"};
const payClass={"Unpaid":"unpaid","Paid":"paid","Waived":"waived"};
const LABELS={invoiceNumber:"invoice #",qty:"qty",dateReceived:"date received",dateOut:"date out",item:"item",category:"category",description:"description",status:"status",paymentStatus:"payment",repairTime:"repair time",materialCost:"material cost"};

let db=null,me={name:"Someone"},repairs=[],view="table",openId=null;

const $=id=>document.getElementById(id);
const esc=s=>(s??"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate=d=>d||"—";
const fmtTs=t=>{try{return new Date(t).toLocaleString("en-NZ",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"});}catch(e){return t;}};
const totalTime=r=>r.repairTime!=null?(+r.repairTime||0):(+r.unpickingTime||0)+(+r.fixingTime||0)+(+r.otherTime||0);
const money=v=>v==null||v===""?"—":"$"+(+v).toFixed(2);
const fill=(sel,opts,ph)=>{sel.innerHTML=`<option value="">${ph}</option>`+opts.map(o=>`<option>${o}</option>`).join("");};
fill($("filterStatus"),STATUSES,"All statuses");fill($("filterPayment"),PAYMENTS,"All payment");

function showBanner(m){$("banner").innerHTML=`<div class="banner">${esc(m)}</div>`;setTimeout(()=>{$("banner").innerHTML="";},5000);}

/* ---- data layer (Supabase) ---- */
const mkEvent=(type,text)=>({type,text,by_name:me.name,source:null});
const toRow=d=>({invoice_number:d.invoiceNumber,qty:d.qty,date_received:d.dateReceived||null,date_out:d.dateOut||null,item:d.item,category:d.category,description:d.description,status:d.status,payment_status:d.paymentStatus,repair_time:d.repairTime,material_cost:d.materialCost});
const fromRow=r=>({id:r.id,invoiceNumber:r.invoice_number,qty:r.qty,dateReceived:r.date_received||"",dateOut:r.date_out||"",item:r.item,category:r.category,description:r.description,status:r.status,paymentStatus:r.payment_status,repairTime:r.repair_time,materialCost:r.material_cost,
  events:(r.repair_events||[]).map(e=>({id:e.id,type:e.type,text:e.text,by:e.by_name,source:e.source,at:e.created_at}))});
async function load(){
  const {data,error}=await db.from("repairs").select("*, repair_events(*)").order("date_received",{ascending:false}).limit(1000);
  if(error){showBanner("Load error: "+error.message);return;}
  repairs=data.map(fromRow);render();
}
let tm=null;const reload=()=>{clearTimeout(tm);tm=setTimeout(load,300);};
async function addEvents(id,evs,extra){
  if(extra){const {error}=await db.from("repairs").update(toRow({...repairs.find(x=>x.id===id),...extra})).eq("id",id);if(error)throw error;}
  const rows=evs.map(e=>({repair_id:id,type:e.type,text:e.text,by_name:e.by_name,source:e.source}));
  if(rows.length){const {error}=await db.from("repair_events").insert(rows);if(error)throw error;}
  await load();
}
async function createRepair(data,evs){
  const {data:row,error}=await db.from("repairs").insert(toRow(data)).select("id").single();if(error)throw error;
  await addEvents(row.id,evs);
}
async function deleteRepair(id){const {error}=await db.from("repairs").delete().eq("id",id);if(error)throw error;await load();}
function refreshHistory(){
  const box=$("history");if(!box||!openId)return;
  const r=repairs.find(x=>x.id===openId);if(!r)return;
  const evs=[...(r.events||[])].sort((a,b)=>b.at.localeCompare(a.at));
  box.innerHTML=evs.length?`<div class="tl">${evs.map(e=>`<div class="ev ${e.type}"><div class="txt">${esc(e.text)}</div><div class="by">${e.type==="comment"?"Comment · ":""}${esc(e.source||e.by||"Someone")} · ${fmtTs(e.at)}</div></div>`).join("")}</div>`:`<div class="empty">No history yet.</div>`;
}

/* ---- render ---- */
function filtered(ignoreStatus){
  const q=$("search").value.trim().toLowerCase(),fs=$("filterStatus").value,fp=$("filterPayment").value;
  return repairs.filter(r=>{
    if(!ignoreStatus&&fs&&r.status!==fs)return false;
    if(fp&&r.paymentStatus!==fp)return false;
    if(q&&!`${r.invoiceNumber} ${r.item} ${r.description}`.toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>(b.dateReceived||"").localeCompare(a.dateReceived||""));
}
function render(){
  $("tableView").style.display=view==="table"?"":"none";
  $("boardView").style.display=view==="board"?"":"none";
  $("filterStatus").style.display=view==="table"?"":"none";
  $("vTable").classList.toggle("active",view==="table");$("vBoard").classList.toggle("active",view==="board");
  if(view==="table")renderTable();else renderBoard();
  const open=repairs.filter(r=>r.status!=="Completed").length;
  const unpaid=repairs.filter(r=>r.paymentStatus==="Unpaid").length;
  const now=new Date();
  const done=repairs.filter(r=>r.status==="Completed"&&r.dateOut&&new Date(r.dateOut).getMonth()===now.getMonth()&&new Date(r.dateOut).getFullYear()===now.getFullYear()).length;
  $("stats").innerHTML=`<div class="stat"><b>${repairs.length}</b><span>Total repairs</span></div><div class="stat"><b>${open}</b><span>Open</span></div><div class="stat"><b>${unpaid}</b><span>Unpaid</span></div><div class="stat"><b>${done}</b><span>Completed this month</span></div>`;
  refreshHistory();
}
function renderTable(){
  const list=filtered(false);
  $("emptyMsg").style.display=list.length?"none":"block";
  $("rows").innerHTML=list.map(r=>`<tr data-upd="${r.id}"><td>${esc(r.invoiceNumber)}</td><td>${fmtDate(r.dateReceived)}</td><td>${esc(r.item)}</td><td>${esc(r.category)}</td><td>${esc(r.qty)}</td>
  <td><span class="pill ${statusClass[r.status]||""}">${esc(r.status)}</span></td><td><span class="pill ${payClass[r.paymentStatus]||""}">${esc(r.paymentStatus)}</span></td>
  <td>${fmtDate(r.dateOut)}</td><td>${totalTime(r)}</td><td>${money(r.materialCost)}</td><td><button class="rowbtn ghost">Update</button></td></tr>`).join("");
  $("rows").querySelectorAll("[data-upd]").forEach(b=>b.onclick=()=>openModal(repairs.find(r=>r.id===b.dataset.upd)));
}
function renderBoard(){
  const list=filtered(true);
  $("boardView").innerHTML=STATUSES.map(s=>{
    const items=list.filter(r=>r.status===s);
    return `<div class="col" data-status="${s}"><div class="col-head"><span>${s}</span><span>${items.length}</span></div><div class="col-body">${items.map(r=>`
    <div class="card" draggable="true" data-id="${r.id}"><b>${esc(r.invoiceNumber)} · ${esc(r.item)}</b>
    <div class="meta">${esc(r.category)} · qty ${esc(r.qty)} · ${totalTime(r)} min · in ${fmtDate(r.dateReceived)}</div>
    <div class="pills"><span class="pill ${payClass[r.paymentStatus]||""}">${esc(r.paymentStatus)}</span><button class="rowbtn ghost">Update</button></div></div>`).join("")}</div></div>`;}).join("");
  const bv=$("boardView");
  bv.querySelectorAll(".card").forEach(c=>{
    c.ondragstart=e=>{e.dataTransfer.setData("text/plain",c.dataset.id);c.classList.add("dragging");};
    c.ondragend=()=>c.classList.remove("dragging");
    c.onclick=()=>openModal(repairs.find(r=>r.id===c.dataset.id));
  });
  bv.querySelectorAll(".col").forEach(col=>{
    col.ondragover=e=>{e.preventDefault();col.classList.add("dragover");};
    col.ondragleave=()=>col.classList.remove("dragover");
    col.ondrop=async e=>{
      e.preventDefault();col.classList.remove("dragover");
      const r=repairs.find(x=>x.id===e.dataTransfer.getData("text/plain"));
      if(!r||r.status===col.dataset.status||!db)return;
      try{await addEvents(r.id,[mkEvent("event",`Status: ${r.status} → ${col.dataset.status}`)],{status:col.dataset.status});}
      catch(err){showBanner("Could not move: "+err.message);}
    };
  });
}

/* ---- modal ---- */
function openModal(existing){
  const r=existing||{};openId=existing?existing.id:null;
  const back=document.createElement("div");back.className="modal-back";
  const close=()=>{openId=null;back.remove();};
  back.innerHTML=`<div class="modal"><h2>${existing?"Update repair":"New repair"}</h2>
  <div class="grid2">
    <div class="field"><label>Invoice number</label><input id="f-invoice" value="${esc(r.invoiceNumber)}"></div>
    <div class="field"><label>Qty</label><input id="f-qty" type="number" min="1" value="${r.qty??1}"></div>
    <div class="field"><label>Date received</label><input id="f-received" type="date" value="${r.dateReceived||""}"></div>
    <div class="field"><label>Date out</label><input id="f-out" type="date" value="${r.dateOut||""}"></div>
    <div class="field"><label>Item</label><input id="f-item" value="${esc(r.item)}"></div>
    <div class="field"><label>Category</label><select id="f-category">${CATEGORIES.map(c=>`<option ${r.category===c?"selected":""}>${c}</option>`).join("")}</select></div>
  </div>
  <div class="field"><label>Description of repair</label><textarea id="f-desc">${esc(r.description)}</textarea></div>
  <div class="grid2">
    <div class="field"><label>Status</label><select id="f-status">${STATUSES.map(s=>`<option ${r.status===s?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="field"><label>Payment status</label><select id="f-payment">${PAYMENTS.map(p=>`<option ${r.paymentStatus===p?"selected":""}>${p}</option>`).join("")}</select></div>
    <div class="field"><label>Repair time (min)</label><input id="f-repair" type="number" min="0" value="${totalTime(r)}"></div>
    <div class="field"><label>Raw material cost ($)</label><input id="f-material" type="number" min="0" step="0.01" value="${r.materialCost??""}"></div>
  </div>
  <div class="field"><label>Comment</label><textarea id="f-comment" placeholder="Add a comment (posted when you save)…"></textarea></div>
  <div class="modal-actions"><div>${existing?`<button class="ghost" id="f-delete" style="color:var(--danger)">Delete</button>`:""}</div>
    <div style="display:flex;gap:8px;"><button class="ghost" id="f-cancel">Close</button><button class="primary" id="f-save">Save</button></div></div>
  ${existing?`<h3>History</h3><div id="history"></div>`:""}</div>`;
  document.body.appendChild(back);
  back.onclick=e=>{if(e.target===back)close();};
  $("f-cancel").onclick=close;
  if(existing){
    refreshHistory();
    $("f-delete").onclick=async()=>{if(!confirm("Delete this repair and its history?"))return;
      try{await deleteRepair(existing.id);close();}catch(e){showBanner("Could not delete: "+e.message);}};
  }
  $("f-save").onclick=async()=>{
    const data={invoiceNumber:$("f-invoice").value.trim(),qty:+$("f-qty").value||1,dateReceived:$("f-received").value,dateOut:$("f-out").value,
      item:$("f-item").value.trim(),category:$("f-category").value,description:$("f-desc").value.trim(),status:$("f-status").value,
      paymentStatus:$("f-payment").value,repairTime:+$("f-repair").value||0,materialCost:$("f-material").value===""?null:(+$("f-material").value||0)};
    if(!data.invoiceNumber||!data.item){showBanner("Invoice number and item are required.");return;}
    const cText=$("f-comment").value.trim();
    try{
      if(existing){
        const parts=[];const prev={...r,repairTime:totalTime(r)};const norm=v=>v==null?"":v;
        for(const k of Object.keys(LABELS)){
          if(norm(prev[k])!==norm(data[k])){
            if(k==="status"||k==="paymentStatus")parts.push(`${LABELS[k]}: ${r[k]||"—"} → ${data[k]}`);
            else if(k==="dateReceived"||k==="dateOut")parts.push(`${LABELS[k]}: ${data[k]||"cleared"}`);
            else parts.push(LABELS[k]);
          }
        }
        const plain=parts.filter(p=>!p.includes("→")&&!p.includes(":"));
        const rich=parts.filter(p=>p.includes("→")||p.includes(":"));
        const txt=[...rich,...(plain.length?["updated "+plain.join(", ")]:[])].join("; ");
        const evs=[];if(txt)evs.push(mkEvent("event",txt.charAt(0).toUpperCase()+txt.slice(1)));if(cText)evs.push(mkEvent("comment",cText));
        if(evs.length)await addEvents(existing.id,evs,data);
      }else{
        await createRepair(data,[mkEvent("event","Repair added"),...(cText?[mkEvent("comment",cText)]:[])]);
      }
      close();
    }catch(e){showBanner("Could not save: "+e.message);}
  };
}

$("addBtn").onclick=()=>{if(!db){showBanner("Not connected yet — try again in a moment.");return;}openModal(null);};
$("vTable").onclick=()=>{view="table";render();};
$("vBoard").onclick=()=>{view="board";render();};
["search"].forEach(i=>$(i).addEventListener("input",render));
["filterStatus","filterPayment"].forEach(i=>$(i).addEventListener("change",render));

const niceName=u=>(u.user_metadata&&u.user_metadata.name)||(u.email||"Someone").split("@")[0].replace(/[._]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
function showLogin(msg){
  const back=document.createElement("div");back.className="modal-back";
  back.innerHTML=`<div class="modal" style="max-width:360px"><h2>Sign in</h2>${msg?`<div class="banner">${esc(msg)}</div>`:""}<div class="field"><label>Email</label><input id="l-email" type="email"></div><div class="field"><label>Password</label><input id="l-pass" type="password"></div><div class="modal-actions"><span></span><button class="primary" id="l-go">Sign in</button></div></div>`;
  document.body.appendChild(back);
  const go=async()=>{const {error}=await db.auth.signInWithPassword({email:$("l-email").value.trim(),password:$("l-pass").value});back.remove();if(error)showLogin(error.message);else start();};
  $("l-go").onclick=go;$("l-pass").onkeydown=e=>{if(e.key==="Enter")go();};
}
async function start(){
  const {data:{user}}=await db.auth.getUser();me={name:niceName(user)};
  document.querySelector("header").insertAdjacentHTML("beforeend",`<button class="ghost" id="signout" style="position:absolute;right:16px;top:14px">Sign out</button>`);
  $("signout").onclick=async()=>{await db.auth.signOut();location.reload();};
  await load();
  db.channel("repair-lab").on("postgres_changes",{event:"*",schema:"public",table:"repairs"},reload).on("postgres_changes",{event:"*",schema:"public",table:"repair_events"},reload).subscribe();
}
async function init(){
  db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  const {data:{session}}=await db.auth.getSession();
